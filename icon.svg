<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#3a2fb0"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#101014"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- vinyl record -->
  <g transform="translate(256 256)">
    <circle r="176" fill="url(#disc)"/>
    <circle r="176" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
    <circle r="150" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <circle r="124" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <circle r="98"  fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <!-- label -->
    <circle r="66" fill="#8f83ff"/>
    <circle r="66" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <circle r="9"  fill="#101014"/>
  </g>

  <!-- eighth note, sitting on the label -->
  <g transform="translate(232 210)" fill="#ffffff">
    <rect x="54" y="4" width="11" height="92" rx="5"/>
    <path d="M65 4 C 96 8, 104 22, 92 44 C 96 26, 84 20, 65 24 Z"/>
    <ellipse cx="44" cy="98" rx="24" ry="18" transform="rotate(-18 44 98)"/>
  </g>
</svg>
